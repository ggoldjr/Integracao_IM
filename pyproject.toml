[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "integracao-im"
version = "0.1.0"
description = "REST service that validates IM sensor JSON messages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "joblib>=1.5,<2.0",
  "pandas>=2.3,<4.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0"]

[project.scripts]
integracao-im = "integracao_im.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
